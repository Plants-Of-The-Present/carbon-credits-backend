version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: carbon-credits-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carbon_credits}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - carbon-credits-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbon-credits-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-carbon_credits}
      JWT_SECRET: ${JWT_SECRET:-your_super_secure_jwt_secret_here}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      AI_SERVICE_URL: http://ai-service:5000
    ports:
      - "3001:${PORT:-3000}"
    volumes:
      - .:/app
      - /app/node_modules
      - uploads:/app/uploads
    networks:
      - carbon-credits-network
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run start

  # Serviço de IA
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: carbon-credits-ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
    networks:
      - carbon-credits-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: carbon-credits-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - carbon-credits-network
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
  uploads:

networks:
  carbon-credits-network:
    external: true